<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Heartbeat 💓 My heart beats for you</title>
<meta name="description" content="A heart monitor that writes I LOVE YOU with its pulse. Type their name, press Start, send them the link. Made by @hack.n.code">
<meta property="og:title" content="Someone's heart is beating for you 💓">
<meta property="og:description" content="Open it with the sound on… Heartbeat by @hack.n.code">
<meta name="theme-color" content="#020805">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Poppins:wght@500;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header id="top">
    <div class="tl"><span class="rec" id="rec"></span>BED 143</div>
    <div class="tr" id="clock">12:00</div>
  </header>

  <section id="vitals">
    <div class="box pat">
      <div class="lbl">PATIENT</div>
      <div class="pname" id="pname">For you</div>
      <div class="sub">SpO₂ <b>100</b> · LOVE <b id="lovePct">LOW</b></div>
    </div>
    <div class="box hr" id="hrBox">
      <div class="lbl">HR <span class="ht" id="ht">♥</span></div>
      <div class="bpm" id="bpm">72</div>
      <div class="sub">bpm</div>
    </div>
  </section>

  <section id="monWrap">
    <canvas id="mon"></canvas>
    <div id="msg">
      <div class="m1" id="m1">My heart beats for you,</div>
      <div class="m2" id="m2">Priya</div>
      <div class="m3"><span>143</span> = I love you ❤️</div>
    </div>
  </section>

  <div id="status"><span id="stDot">●</span> <span id="stTxt">NORMAL SINUS RHYTHM</span></div>

  <section id="panel">
    <div id="form">
      <label for="name">Whose name makes your heart race?</label>
      <div class="field"><input id="name" maxlength="18" autocomplete="off" spellcheck="false" placeholder="Type their name"><span id="caret"></span></div>
      <div class="row">
        <button id="go" class="btn main">Start ❤</button>
        <button id="share" class="btn ghost" aria-label="Share">Share 💌</button>
      </div>
    </div>
    <div id="after">
      <div class="row">
        <button id="replay" class="btn ghost">Replay ↻</button>
        <button id="share2" class="btn main">Send it 💌</button>
      </div>
    </div>
  </section>

  <footer id="foot">Made by <a href="https://instagram.com/hack.n.code" target="_blank" rel="noopener">@hack.n.code</a></footer>
</main>
<div id="gate"><div class="gin"><div class="gh">💓</div><div class="gt" id="gateTxt">Someone's heart is beating for you</div><div class="gs">Tap to listen (sound on 🔊)</div></div></div>
<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
